<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Puti-AI | Google 全家桶少林足球 3D 黏土大舞台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #eae5db; font-family: "jf-openhuninn", "Noto Sans TC", sans-serif;
    user-select: none;
  }
  #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; }
  canvas { display: block; width: 100% !important; height: 100% !important; }

  /* 頂部標題與狀態 */
  #header {
    position: absolute; top: 20px; left: 24px; z-index: 10;
    display: flex; align-items: center; gap: 14px;
    background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px);
    padding: 12px 24px; border-radius: 999px;
    box-shadow: 0 10px 25px rgba(26, 35, 58, 0.08);
    border: 1px solid rgba(0,0,0,0.06);
  }
  #header .badge {
    background: #c65322; color: #fff; padding: 4px 12px;
    border-radius: 999px; font-size: 14px; font-weight: 900;
  }
  #header .title {
    font-size: 18px; font-weight: 900; color: #1a233a; letter-spacing: 0.5px;
  }

  /* 底部演技特技主控台 */
  #action-bar {
    position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; align-items: center; gap: 10px;
    background: rgba(26, 35, 58, 0.92); backdrop-filter: blur(14px);
    padding: 12px 20px; border-radius: 24px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
    max-width: 95%; flex-wrap: wrap; justify-content: center;
  }
  .act-btn {
    background: rgba(255, 255, 255, 0.12); color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.18);
    padding: 8px 16px; border-radius: 14px; font-size: 14px; font-weight: 800;
    cursor: pointer; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex; align-items: center; gap: 6px;
  }
  .act-btn:hover {
    background: #c65322; border-color: #c65322;
    transform: translateY(-2px) scale(1.05);
  }
  .act-btn.active {
    background: #ea580c; border-color: #fff;
    box-shadow: 0 0 15px rgba(234, 88, 12, 0.6);
  }

  /* 視角與功能切換 */
  #controls-side {
    position: absolute; top: 20px; right: 24px; z-index: 10;
    display: flex; gap: 10px;
  }
  .side-btn {
    background: rgba(255, 255, 255, 0.92); border: 1px solid rgba(0,0,0,0.06);
    padding: 10px 16px; border-radius: 16px; font-size: 13px; font-weight: 800;
    color: #1a233a; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    transition: all 0.15s;
  }
  .side-btn:hover { background: #fff; color: #c65322; transform: translateY(-1px); }

  /* 角色對白與旁白泡泡 (Pingu 咕噥語) */
  #speech-bubble {
    position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
    background: #fff; color: #1a233a; font-size: 26px; font-weight: 900;
    padding: 14px 32px; border-radius: 999px;
    box-shadow: 0 16px 35px rgba(26, 35, 58, 0.12);
    border: 2px solid #c65322; z-index: 10;
    display: none; align-items: center; gap: 10px;
    animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    0% { transform: translateX(-50%) scale(0.6); opacity: 0; }
    100% { transform: translateX(-50%) scale(1.0); opacity: 1; }
  }

  /* 版權標示 */
  #puti-footer {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-weight: 600; color: rgba(26, 35, 58, 0.45);
    z-index: 5; pointer-events: none;
  }
</style>

<script src="style.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="canvas-container"></div>

<div id="header">
  <div class="badge">Puti-AI 3D 黏土工法</div>
  <div class="title">⚽ Google 全家桶少林足球隊：五虎將演技大排練</div>
</div>

<div id="controls-side">
  <button class="side-btn" id="btn-aspect">📐 切換 9:16 直式</button>
  <button class="side-btn" id="btn-reset-cam">🎥 重設鏡頭</button>
</div>

<div id="speech-bubble">
  <span id="speech-icon">📯</span>
  <span id="speech-text">Noot! Noot!!</span>
</div>

<div id="action-bar">
  <button class="act-btn active" data-act="lineup">👥 1. 全員擺陣 (Lineup)</button>
  <button class="act-btn" data-act="gemini_kick">🚀 2. Gemini 飛升720度迴旋踢</button>
  <button class="act-btn" data-act="drive_slam">🛡️ 3. Drive 泰山壓頂地震波</button>
  <button class="act-btn" data-act="gmail_drift">✈️ 4. Gmail 水上飄傾斜極速甩尾</button>
  <button class="act-btn" data-act="notebook_laser">👓 5. NotebookLM 戰術光束</button>
  <button class="act-btn" data-act="photos_flash">📸 6. Photos 陀螺定格爆閃</button>
  <button class="act-btn" data-act="full_combo">⚽ 7. 【少林全體連動射門】</button>
</div>

<div id="puti-footer">屏東縣後庄國小黃朝榮老師作品，免費分享，歡迎擴散推廣</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

// ==========================================
// 1. 樣式與音效加載
// ==========================================
const S = window.CLAY_STYLE || {
  palette: {
    hero: { clay_orange: "#c65322" },
    environment: { ground: "#eae5db", stage_bg: "#eae5db", contact_shadow: "rgba(16, 12, 8, 0.78)" }
  },
  lighting: {
    hemisphere: { sky_color: "#fffaed", ground_color: "#d2c8b8", intensity: 1.0 },
    key_light: { color: "#fff5e4", intensity: 1.85, position: [5.5, 9.5, 7.5] },
    fill_light: { color: "#9db8eb", intensity: 0.85, position: [-6, 7, -4] }
  },
  materials: { clay_body: { roughness: 0.82 }, clay_ground: { roughness: 0.95 } }
};

// 載入程序化音效實體
const sounds = {
  whistle: new Audio("audio/sfx_whistle.wav"),
  whoosh: new Audio("audio/sfx_whoosh.wav"),
  thud: new Audio("audio/sfx_thud.wav"),
  laser: new Audio("audio/sfx_laser.wav"),
  shutter: new Audio("audio/sfx_shutter.wav"),
  boing: new Audio("audio/sfx_boing.wav"),
  ding: new Audio("audio/sfx_ding.wav"),
  dong: new Audio("audio/sfx_dong.wav"),
  chiang: new Audio("audio/sfx_chiang.wav"),
  noot: new Audio("audio/vo_pingu_noot.wav"),
  huh: new Audio("audio/vo_pingu_huh.wav"),
  hehe: new Audio("audio/vo_pingu_hehe.wav")
};

function playSound(name) {
  if (sounds[name]) {
    try {
      sounds[name].currentTime = 0;
      sounds[name].play().catch(() => {});
    } catch(e) {}
  }
}

// ==========================================
// 2. 渲染器、相機與燈光設定
// ==========================================
const container = document.getElementById("canvas-container");
let W = window.innerWidth, H = window.innerHeight;
let isVertical = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color(S.palette.environment.stage_bg);

const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 100);
camera.position.set(0, 3.2, 10.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0.9, 0);
controls.maxPolarAngle = Math.PI / 2 - 0.02; // 禁止穿透地面

// 燈光系統
const hemi = new THREE.HemisphereLight(
  S.lighting.hemisphere.sky_color,
  S.lighting.hemisphere.ground_color,
  S.lighting.hemisphere.intensity
);
scene.add(hemi);

const dirLight = new THREE.DirectionalLight(S.lighting.key_light.color, S.lighting.key_light.intensity);
dirLight.position.set(...S.lighting.key_light.position);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.bias = -0.0003;
dirLight.shadow.radius = 3.5;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(S.lighting.fill_light.color, S.lighting.fill_light.intensity);
fillLight.position.set(...S.lighting.fill_light.position);
scene.add(fillLight);

// 相機快門爆閃光源 (Photos 拍照特效)
const flashLight = new THREE.PointLight(0xffffff, 0, 15);
scene.add(flashLight);

// ==========================================
// 3. 地面與接觸陰影 (Contact AO)
// ==========================================
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({
    color: new THREE.Color(S.palette.environment.ground),
    roughness: S.materials.clay_ground.roughness,
    metalness: 0.0
  })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

function createContactShadow(radius = 128) {
  const c = document.createElement("canvas");
  c.width = c.height = radius;
  const ctx = c.getContext("2d");
  const grad = ctx.createRadialGradient(radius/2, radius/2, 0, radius/2, radius/2, radius/2);
  grad.addColorStop(0, S.palette.environment.contact_shadow || "rgba(16, 12, 8, 0.78)");
  grad.addColorStop(0.3, "rgba(24, 18, 12, 0.45)");
  grad.addColorStop(0.65, "rgba(38, 28, 20, 0.15)");
  grad.addColorStop(1, "rgba(0, 0, 0, 0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, radius, radius);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  return tex;
}
const shadowTex = createContactShadow();

function attachShadow(parent, w = 1.0, h = 1.0, opacity = 0.8) {
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, opacity, depthWrite: false })
  );
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = 0.005;
  scene.add(mesh);
  return mesh;
}

// 環形地震波 (Drive 泰山壓頂特效)
const shockRing = new THREE.Mesh(
  new THREE.RingGeometry(0.2, 0.45, 48),
  new THREE.MeshBasicMaterial({ color: 0x1a233a, transparent: true, opacity: 0, side: THREE.DoubleSide })
);
shockRing.rotation.x = -Math.PI / 2;
shockRing.position.y = 0.008;
scene.add(shockRing);

// ==========================================
// 4. 角色造型建模（五虎將 ╳ 少林足球）
// ==========================================
const team = new THREE.Group();
scene.add(team);

// 輔助函式：黑豆眼
function createEye() {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.045, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0x1a233a })
  );
  return m;
}

// --- [1. 隊長 Gemini (阿星)] ---
const gemini = new THREE.Group();
const gemBody = new THREE.Mesh(
  new RoundedBoxGeometry(0.65, 0.85, 0.55, 6, 0.22),
  new THREE.MeshStandardMaterial({
    color: new THREE.Color(S.palette.hero.clay_orange),
    roughness: S.materials.clay_body.roughness,
    metalness: 0.0
  })
);
gemBody.castShadow = true;
gemini.add(gemBody);

// 眼睛與腮紅
const gEyeL = createEye(); gEyeL.position.set(-0.16, 0.12, 0.28);
const gEyeR = createEye(); gEyeR.position.set(0.16, 0.12, 0.28);
gemBody.add(gEyeL, gEyeR);

// Pingu 伸縮喇叭嘴 (平時微凸，喊 Noot 時拉長成喇叭)
const trumpetGeo = new THREE.ConeGeometry(0.12, 0.35, 24);
trumpetGeo.rotateX(Math.PI / 2);
const trumpetMouth = new THREE.Mesh(
  trumpetGeo,
  new THREE.MeshStandardMaterial({ color: 0xea580c, roughness: 0.75 })
);
trumpetMouth.position.set(0, -0.05, 0.30);
trumpetMouth.scale.set(0.8, 0.8, 0.25); // 預設短嘴
gemBody.add(trumpetMouth);

// 隊長少林黃頭巾
const headband = new THREE.Mesh(
  new THREE.CylinderGeometry(0.36, 0.36, 0.08, 24),
  new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.6 })
);
headband.position.set(0, 0.36, 0);
gemBody.add(headband);

gemini.position.set(0, 0.45, 0);
const gemShadow = attachShadow(gemini, 1.1, 1.1, 0.75);
team.add(gemini);

// --- [2. 守門員 Google Drive (鐵布衫)] ---
const drive = new THREE.Group();
const driveBody = new THREE.Mesh(
  new RoundedBoxGeometry(1.25, 1.25, 0.95, 6, 0.25),
  new THREE.MeshStandardMaterial({ color: 0x34a853, roughness: 0.85 }) // Drive 翡翠綠
);
driveBody.castShadow = true;
drive.add(driveBody);

// Drive 標誌性的黃色與藍色側腹塊
const dPatchYellow = new THREE.Mesh(
  new RoundedBoxGeometry(0.35, 1.15, 0.96, 4, 0.1),
  new THREE.MeshStandardMaterial({ color: 0xfbbc05, roughness: 0.85 })
);
dPatchYellow.position.x = -0.42;
driveBody.add(dPatchYellow);

const dPatchBlue = new THREE.Mesh(
  new RoundedBoxGeometry(0.35, 1.15, 0.96, 4, 0.1),
  new THREE.MeshStandardMaterial({ color: 0x4285f4, roughness: 0.85 })
);
dPatchBlue.position.x = 0.42;
driveBody.add(dPatchBlue);

// 敦厚黑豆眼
const dEyeL = createEye(); dEyeL.position.set(-0.22, 0.25, 0.50);
const dEyeR = createEye(); dEyeR.position.set(0.22, 0.25, 0.50);
driveBody.add(dEyeL, dEyeR);

drive.position.set(-2.8, 0.65, -0.6);
const driveShadow = attachShadow(drive, 1.8, 1.8, 0.85);
team.add(drive);

// --- [3. 前鋒 Gmail (水上飄)] ---
const gmail = new THREE.Group();
const gmBody = new THREE.Mesh(
  new RoundedBoxGeometry(0.85, 0.65, 0.42, 6, 0.15),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.70 }) // 象牙純白信封
);
gmBody.castShadow = true;
gmail.add(gmBody);

// Gmail 紅色經典 "M" 標誌摺痕
const gmStripe = new THREE.Mesh(
  new THREE.BoxGeometry(0.70, 0.12, 0.44),
  new THREE.MeshStandardMaterial({ color: 0xea4335, roughness: 0.65 })
);
gmStripe.position.set(0, 0.10, 0);
gmBody.add(gmStripe);

// 帥氣瞇瞇眼
const gmEyeL = createEye(); gmEyeL.position.set(-0.18, 0.05, 0.23);
const gmEyeR = createEye(); gmEyeR.position.set(0.18, 0.05, 0.23);
gmBody.add(gmEyeL, gmEyeR);

gmail.position.set(2.4, 0.35, 0.8);
const gmShadow = attachShadow(gmail, 1.1, 1.1, 0.65);
team.add(gmail);

// --- [4. 軍師 NotebookLM (學霸眼鏡)] ---
const notebook = new THREE.Group();
const nbBody = new THREE.Mesh(
  new RoundedBoxGeometry(0.70, 0.80, 0.48, 6, 0.16),
  new THREE.MeshStandardMaterial({ color: 0x4f46e5, roughness: 0.75 }) // 靛紫高智商
);
nbBody.castShadow = true;
notebook.add(nbBody);

// 招牌厚黑框大圓眼鏡
const glassesGroup = new THREE.Group();
const rimGeo = new THREE.TorusGeometry(0.11, 0.025, 16, 32);
const rimMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });
const rimL = new THREE.Mesh(rimGeo, rimMat); rimL.position.set(-0.15, 0.12, 0.26);
const rimR = new THREE.Mesh(rimGeo, rimMat); rimR.position.set(0.15, 0.12, 0.26);
const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.02, 0.02), rimMat);
bridge.position.set(0, 0.12, 0.26);
glassesGroup.add(rimL, rimR, bridge);
nbBody.add(glassesGroup);

// 鏡片內的眼睛
const nbEyeL = createEye(); nbEyeL.position.set(-0.15, 0.12, 0.25);
const nbEyeR = createEye(); nbEyeR.position.set(0.15, 0.12, 0.25);
nbBody.add(nbEyeL, nbEyeR);

notebook.position.set(-1.4, 0.42, 1.2);
const nbShadow = attachShadow(notebook, 1.0, 1.0, 0.65);
team.add(notebook);

// 戰術激光射線 (Laser Ray)
const laserLineGeo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(0, 0, 0), new THREE.Vector3(1.5, 0.8, -1.2)
]);
const laserLine = new THREE.Line(
  laserLineGeo,
  new THREE.LineBasicMaterial({ color: 0x22c55e, linewidth: 3, transparent: true, opacity: 0 })
);
notebook.add(laserLine);

// --- [5. 邊鋒 Google Photos (旋風相機)] ---
const photos = new THREE.Group();
const phBody = new THREE.Mesh(
  new RoundedBoxGeometry(0.68, 0.68, 0.52, 6, 0.18),
  new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.65 })
);
phBody.castShadow = true;
photos.add(phBody);

// 四色風車標籤
const cRed = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.24, 0.54), new THREE.MeshStandardMaterial({ color: 0xea4335 }));
cRed.position.set(-0.13, 0.13, 0); phBody.add(cRed);
const cBlue = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.24, 0.54), new THREE.MeshStandardMaterial({ color: 0x4285f4 }));
cBlue.position.set(0.13, 0.13, 0); phBody.add(cBlue);
const cYellow = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.24, 0.54), new THREE.MeshStandardMaterial({ color: 0xfbbc05 }));
cYellow.position.set(-0.13, -0.13, 0); phBody.add(cYellow);
const cGreen = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.24, 0.54), new THREE.MeshStandardMaterial({ color: 0x34a853 }));
cGreen.position.set(0.13, -0.13, 0); phBody.add(cGreen);

// 相機鏡頭（中央凸出）
const lens = new THREE.Mesh(
  new THREE.CylinderGeometry(0.09, 0.09, 0.12, 16),
  new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3, metalness: 0.5 })
);
lens.rotation.x = Math.PI / 2;
lens.position.set(0, 0, 0.28);
phBody.add(lens);

photos.position.set(1.5, 0.36, -0.9);
const phShadow = attachShadow(photos, 1.0, 1.0, 0.65);
team.add(photos);

// --- [6. 少林全彩能量足球 (Energy Ball)] ---
const ball = new THREE.Group();
const ballMesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.26, 32, 32),
  new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.35, metalness: 0.1,
    emissive: 0xfbbf24, emissiveIntensity: 0.2
  })
);
ballMesh.castShadow = true;
ball.add(ballMesh);
ball.position.set(0, 0.26, 2.2);
const ballShadow = attachShadow(ball, 0.6, 0.6, 0.8);
scene.add(ball);

// ==========================================
// 5. 演技狀態機與動力學動畫系統
// ==========================================
let currentAct = "lineup";
let actTime = 0;
const bubble = document.getElementById("speech-bubble");
const bIcon = document.getElementById("speech-icon");
const bText = document.getElementById("speech-text");

function showBubble(icon, text, dur = 2.0) {
  bIcon.textContent = icon;
  bText.textContent = text;
  bubble.style.display = "flex";
  clearTimeout(bubble._timer);
  bubble._timer = setTimeout(() => { bubble.style.display = "none"; }, dur * 1000);
}

// 換動作主控
document.querySelectorAll(".act-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".act-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentAct = btn.dataset.act;
    actTime = 0;
    resetCharacters();
    executeActEntry(currentAct);
  });
});

function resetCharacters() {
  gemini.position.set(0, 0.45, 0); gemini.rotation.set(0, 0, 0); gemBody.scale.set(1, 1, 1); trumpetMouth.scale.set(0.8, 0.8, 0.25);
  drive.position.set(-2.8, 0.65, -0.6); drive.rotation.set(0, 0, 0); driveBody.scale.set(1, 1, 1);
  gmail.position.set(2.4, 0.35, 0.8); gmail.rotation.set(0, 0, 0); gmBody.scale.set(1, 1, 1);
  notebook.position.set(-1.4, 0.42, 1.2); notebook.rotation.set(0, 0, 0); glassesGroup.position.set(0, 0, 0); laserLine.material.opacity = 0;
  photos.position.set(1.5, 0.36, -0.9); photos.rotation.set(0, 0, 0); flashLight.intensity = 0;
  ball.position.set(0, 0.26, 2.2); ball.rotation.set(0, 0, 0);
  shockRing.material.opacity = 0;
}

function executeActEntry(act) {
  if (act === "lineup") {
    playSound("whistle");
    showBubble("📯", "師兄弟歸位！！（Noot Noot!）", 2.2);
  } else if (act === "gemini_kick") {
    playSound("boing");
    setTimeout(() => playSound("noot"), 400);
    setTimeout(() => playSound("whoosh"), 850);
    setTimeout(() => playSound("chiang"), 1350);
    showBubble("🥋", "大力金剛腿・720度天地大逆轉！", 2.5);
  } else if (act === "drive_slam") {
    playSound("whoosh");
    setTimeout(() => playSound("thud"), 600);
    setTimeout(() => playSound("dong"), 850);
    showBubble("🛡️", "鐵布衫泰山壓頂・果凍肚皮吸收！", 2.5);
  } else if (act === "gmail_drift") {
    playSound("whoosh");
    setTimeout(() => playSound("whoosh"), 700);
    showBubble("✈️", "水上飄極速大傾斜・穿梭助攻！", 2.2);
  } else if (act === "notebook_laser") {
    playSound("ding");
    setTimeout(() => playSound("laser"), 500);
    showBubble("👓", "軍師推眼鏡・激光演算最佳球路！", 2.5);
  } else if (act === "photos_flash") {
    playSound("whoosh");
    setTimeout(() => playSound("shutter"), 650);
    showBubble("📸", "旋風陀螺步・快門強光定格！", 2.2);
  } else if (act === "full_combo") {
    playSound("whistle");
    showBubble("⚽", "少林 Google 全家桶・合體大絕殺！", 4.0);
    setTimeout(() => playSound("dong"), 800);
    setTimeout(() => playSound("whoosh"), 1500);
    setTimeout(() => playSound("laser"), 2200);
    setTimeout(() => playSound("noot"), 3000);
    setTimeout(() => playSound("chiang"), 3600);
    setTimeout(() => playSound("hehe"), 4200);
  }
}

// 逐幀演技演繹
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  actTime += dt;
  const t = actTime;

  // 1. 全員呼吸與企鵝搖擺 (Default Idle)
  const waddle = Math.sin(t * 3.5);
  const breath = 1.0 + Math.sin(t * 4.0) * 0.03;

  if (currentAct === "lineup") {
    // 每個角色微幅搖擺、黑豆眼轉動
    gemini.rotation.z = waddle * 0.08;
    drive.scale.y = 1.0 + Math.sin(t * 2.5) * 0.04;
    gmail.rotation.y = Math.sin(t * 2.0) * 0.15;
    notebook.position.y = 0.42 + Math.abs(Math.sin(t * 3.0)) * 0.05;
    photos.rotation.y += dt * 0.8;
  }
  else if (currentAct === "gemini_kick") {
    // 蓄力 (0 ~ 0.4s) -> 飛升 (0.4 ~ 1.0s) -> 720旋轉 (1.0 ~ 1.4s) -> 金剛腿重擊 (1.4s) -> 落地回彈
    if (t < 0.4) {
      const u = t / 0.4;
      gemBody.scale.set(1.35, 0.65, 1.35); // 壓扁蓄力
      gemini.position.y = 0.25;
      trumpetMouth.scale.set(0.8, 0.8, 0.25);
    } else if (t < 1.0) {
      const u = (t - 0.4) / 0.6;
      gemBody.scale.set(0.75, 1.45, 0.75); // 騰空拉伸
      gemini.position.y = 0.45 + Math.sin(u * Math.PI * 0.5) * 3.2; // 垂直飛升 3.5 米！
      // 嘴巴爆伸成 Pingu 喇叭！
      trumpetMouth.scale.set(1.3, 1.3, 2.5);
    } else if (t < 1.5) {
      // 720 度空中特技迴旋踢
      const u = (t - 1.0) / 0.5;
      gemini.position.y = 3.65 - u * 0.6;
      gemini.rotation.y = u * Math.PI * 4; // 720 度自轉
      gemini.rotation.x = -Math.PI / 3;    // 傾斜飛踢身姿
      trumpetMouth.scale.set(1.4, 1.4, 3.0);
      ball.position.set(0, 3.2, 0.8);      // 球被吸引到踢點
    } else if (t < 2.2) {
      // 踢爆衝出 + 落地回彈
      const u = (t - 1.5) / 0.7;
      ball.position.z += dt * 18.0;        // 足球火箭般呼嘯射出！
      ball.rotation.x += dt * 30.0;
      gemini.position.y = Math.max(0.45, 3.05 - u * 4.5);
      gemini.rotation.x = THREE.MathUtils.lerp(gemini.rotation.x, 0, 0.1);
      gemini.rotation.y = 0;
      gemBody.scale.set(1.2, 0.8, 1.2);
    } else {
      gemBody.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
      trumpetMouth.scale.lerp(new THREE.Vector3(0.8, 0.8, 0.25), 0.1);
    }
  }
  else if (currentAct === "drive_slam") {
    // 高空砸下 (0 ~ 0.6s) -> 地震波 (0.6s) -> 果凍肚皮 (0.6 ~ 2.0s)
    if (t < 0.6) {
      const u = t / 0.6;
      drive.position.y = 5.0 - u * u * 4.35; // 加速下墜
      driveBody.scale.set(0.8, 1.4, 0.8);
    } else if (t < 2.0) {
      const u = t - 0.6;
      drive.position.y = 0.65;
      // 果凍肚皮波浪衰減 (Jelly oscillation)
      const jiggle = Math.exp(-u * 3.5) * Math.sin(u * 16.0);
      driveBody.scale.set(1.0 + jiggle * 0.45, 1.0 - jiggle * 0.35, 1.0 + jiggle * 0.45);
      // 環形地震波擴散
      shockRing.material.opacity = Math.max(0, 0.8 - u * 0.9);
      const ringScale = 1.0 + u * 8.5;
      shockRing.scale.set(ringScale, ringScale, 1);
    }
  }
  else if (currentAct === "gmail_drift") {
    // 像戰鬥機一樣水上飄大傾斜穿梭 (Banking Curves)
    const cycle = (t * 1.8) % (Math.PI * 2);
    gmail.position.x = Math.sin(cycle) * 3.2;
    gmail.position.z = Math.cos(cycle) * 1.8;
    // 航向角與過彎大傾斜 35 度！
    gmail.rotation.y = -cycle + Math.PI / 2;
    gmail.rotation.z = Math.sin(cycle) * 0.65; // 傾斜
    gmail.position.y = 0.35 + Math.abs(Math.sin(t * 8.0)) * 0.12; // 貼地高速飄動
    gmBody.scale.set(1.15, 0.85, 1.15);
  }
  else if (currentAct === "notebook_laser") {
    // 快速 8Hz 瘋狂點頭運算 + 推眼鏡 + 射出戰術激光
    glassesGroup.position.y = Math.sin(t * 8.0) * 0.04;
    nbBody.rotation.x = Math.sin(t * 16.0) * 0.12; // 超快運算擺頭！
    const u = (Math.sin(t * 3.0) + 1) / 2;
    laserLine.material.opacity = u > 0.3 ? 0.9 : 0;
  }
  else if (currentAct === "photos_flash") {
    // 陀螺高速 1080 度旋轉 -> 煞車爆閃快門！
    if (t < 0.65) {
      photos.rotation.y = (t / 0.65) * Math.PI * 6; // 1080 度旋轉
      photos.position.y = 0.36 + Math.sin(t * 12.0) * 0.2;
    } else {
      photos.position.y = 0.36;
      // 快門強光閃擊 (0.65 ~ 0.9s)
      const flashU = Math.max(0, 1.0 - (t - 0.65) * 5.0);
      flashLight.position.copy(photos.position);
      flashLight.position.z += 0.5;
      flashLight.intensity = flashU * 12.0;
    }
  }
  else if (currentAct === "full_combo") {
    // 完整連攜流程
    const step = Math.floor(t / 0.8);
    if (step === 0) {
      // Drive 接球吸收
      ball.position.lerp(new THREE.Vector3(-2.8, 0.8, -0.6), 0.15);
    } else if (step === 1) {
      // Drive 彈給 NotebookLM
      ball.position.lerp(new THREE.Vector3(-1.4, 0.7, 1.2), 0.2);
    } else if (step === 2) {
      // NotebookLM 激光導航給 Gmail
      laserLine.material.opacity = 0.9;
      ball.position.lerp(new THREE.Vector3(2.4, 0.6, 0.8), 0.22);
    } else if (step === 3) {
      // Gmail 倒掛金鉤拋向半空
      ball.position.lerp(new THREE.Vector3(0, 3.2, 0.8), 0.25);
      gemini.position.y = 2.8;
      gemBody.scale.set(0.8, 1.3, 0.8);
      trumpetMouth.scale.set(1.2, 1.2, 2.2);
    } else if (step >= 4) {
      // Gemini 凌空爆射！
      ball.position.z += dt * 25.0;
      gemini.rotation.y += dt * 15.0;
    }
  }

  // 更新接觸陰影位置
  gemShadow.position.set(gemini.position.x, 0.005, gemini.position.z);
  driveShadow.position.set(drive.position.x, 0.005, drive.position.z);
  gmShadow.position.set(gmail.position.x, 0.005, gmail.position.z);
  nbShadow.position.set(notebook.position.x, 0.005, notebook.position.z);
  phShadow.position.set(photos.position.x, 0.005, photos.position.z);
  ballShadow.position.set(ball.position.x, 0.005, ball.position.z);

  controls.update();
  renderer.render(scene, camera);
}

// 螢幕自適應與 9:16 切換
window.addEventListener("resize", () => {
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

document.getElementById("btn-aspect").addEventListener("click", () => {
  isVertical = !isVertical;
  document.getElementById("btn-aspect").textContent = isVertical ? "📐 切換 16:9 橫式" : "📐 切換 9:16 直式";
  if (isVertical) {
    camera.fov = 46;
    camera.position.set(0, 3.8, 11.8);
  } else {
    camera.fov = 28;
    camera.position.set(0, 3.2, 10.5);
  }
  camera.updateProjectionMatrix();
});

document.getElementById("btn-reset-cam").addEventListener("click", () => {
  controls.reset();
  if (isVertical) {
    camera.position.set(0, 3.8, 11.8);
  } else {
    camera.position.set(0, 3.2, 10.5);
  }
});

// 啟動主迴圈
animate();
</script>
</body>
</html>
